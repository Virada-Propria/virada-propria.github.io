<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} | Virada Própria</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="{{CANONICAL_URL}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <meta property="og:type" content="{{OG_TYPE}}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Virada Própria">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <!-- Incluir somente quando houver imagem apropriada: -->
  <!-- <meta property="og:image" content="{{OG_IMAGE_URL}}"> -->

  <script type="application/ld+json">
  {{SCHEMA_JSON_LD}}
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Y7LQYY0P9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4Y7LQYY0P9');
  </script>

  <style>
    :root {
      --vp-master: #0F2D4A;
      --vp-text: #263640;
      --vp-muted: #667781;
      --vp-border: #E4E9ED;
      --vp-bg: #FFFFFF;
      --vp-soft: rgba(15, 45, 74, .045);
      --vp-soft-strong: rgba(15, 45, 74, .08);
      --vp-radius: 16px;
      --vp-wrap: 1040px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--vp-bg);
      color: var(--vp-text);
      font-family: "Montserrat", Arial, sans-serif;
      line-height: 1.68;
    }
    img { max-width: 100%; height: auto; }
    a { color: inherit; }
    .wrap { width: min(var(--vp-wrap), calc(100% - 32px)); margin: 0 auto; }

    /* Cabeçalho global: nunca sticky/fixed */
    .site-header {
      position: static;
      background: var(--vp-bg);
      border-bottom: 1px solid var(--vp-border);
    }
    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { display: inline-flex; align-items: center; text-decoration: none; }
    .brand img { width: 245px; max-width: 100%; height: auto; display: block; }
    .global-nav { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .global-nav a {
      color: var(--vp-master);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .global-nav a:hover,
    .global-nav a:focus-visible,
    .global-nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 20px 0 0;
      color: var(--vp-muted);
      font-size: 13px;
    }
    .breadcrumbs a { text-decoration: none; }
    .breadcrumbs a:hover, .breadcrumbs a:focus-visible { text-decoration: underline; }

    .hero { padding: 42px 0 30px; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--vp-master);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2, h3 { color: var(--vp-master); letter-spacing: -.02em; }
    h1 { margin: 0 0 14px; font-size: clamp(34px, 6vw, 56px); line-height: 1.08; }
    h2 { margin: 34px 0 12px; font-size: clamp(24px, 4vw, 32px); line-height: 1.2; }
    h3 { margin: 26px 0 10px; font-size: 20px; line-height: 1.3; }
    p { margin: 0 0 16px; }
    .lead { max-width: 820px; color: var(--vp-muted); font-size: 18px; }

    .content { padding: 10px 0 56px; }
    .content-main { max-width: 820px; }
    ul, ol { padding-left: 22px; }
    li + li { margin-top: 7px; }

    .info-box, .attention-box {
      margin: 24px 0;
      padding: 18px 20px;
      border: 1px solid var(--vp-border);
      border-left: 5px solid var(--vp-master);
      border-radius: var(--vp-radius);
      background: var(--vp-soft);
    }

    .cta,
    .cta-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .12s ease, background .12s ease;
    }
    .cta { background: var(--vp-master); color: #fff; border: 1px solid var(--vp-master); }
    .cta-secondary { background: var(--vp-bg); color: var(--vp-master); border: 1px solid var(--vp-border); }
    .cta:hover, .cta-secondary:hover { transform: translateY(-1px); }
    .cta:focus-visible, .cta-secondary:focus-visible { outline: 3px solid var(--vp-soft-strong); outline-offset: 2px; }

    /* Menu intermediário da profissão */
    .profession-menu {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 26px 0 42px;
    }
    .profession-menu a {
      display: block;
      padding: 22px 18px;
      border: 1px solid var(--vp-border);
      border-radius: var(--vp-radius);
      text-decoration: none;
      background: var(--vp-bg);
    }
    .profession-menu strong { display: block; color: var(--vp-master); font-size: 18px; margin-bottom: 6px; }
    .profession-menu span { color: var(--vp-muted); font-size: 14px; }
    .profession-menu a:hover, .profession-menu a:focus-visible { background: var(--vp-soft); }

    /* Lista completa da página de categoria */
    .category-list { display: grid; gap: 14px; margin: 26px 0 34px; }
    .article-card {
      padding: 20px;
      border: 1px solid var(--vp-border);
      border-radius: var(--vp-radius);
      background: var(--vp-bg);
    }
    .article-card h2, .article-card h3 { margin-top: 0; }
    .article-card p { color: var(--vp-muted); }

    /* Cards de produto/review/comparativo */
    .product-card {
      display: grid;
      grid-template-columns: minmax(220px, 290px) 1fr;
      gap: 22px;
      margin: 22px 0;
      padding: 18px;
      border: 1px solid var(--vp-border);
      border-radius: var(--vp-radius);
      background: var(--vp-bg);
    }
    .product-card img { width: 100%; height: 100%; object-fit: contain; }

    .table-wrap { width: 100%; overflow-x: auto; margin: 22px 0; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { padding: 12px 14px; border: 1px solid var(--vp-border); text-align: left; vertical-align: top; }
    th { color: var(--vp-master); background: var(--vp-soft); }

    /* Navegação estrutural obrigatória das matérias finais */
    .article-nav {
      margin: 48px 0 0;
      padding-top: 26px;
      border-top: 1px solid var(--vp-border);
    }
    .next-article {
      display: block;
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid var(--vp-border);
      border-radius: var(--vp-radius);
      background: var(--vp-soft);
      text-decoration: none;
    }
    .next-article small { display: block; margin-bottom: 4px; color: var(--vp-muted); font-weight: 700; }
    .next-article strong { color: var(--vp-master); }
    .return-links { display: flex; flex-wrap: wrap; gap: 10px; }

    .site-footer {
      margin-top: 48px;
      border-top: 1px solid var(--vp-border);
      background: var(--vp-soft);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 24px;
      padding: 30px 0;
      color: var(--vp-muted);
      font-size: 13px;
    }
    .footer-grid strong { color: var(--vp-master); }
    .disclaimer { margin: 8px 0 0; font-size: 12px; line-height: 1.55; }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 14px 0; gap: 10px; }
      .brand img { width: 210px; }
      .global-nav { gap: 12px; }
      .profession-menu { grid-template-columns: 1fr; }
      .product-card { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr; }
      .hero { padding-top: 30px; }
    }
  </style>
</head>
<body class="{{PAGE_TYPE}}">
  <!--
    HTML-BASE CANÔNICO — Virada Própria v1.1
    Este arquivo implementa o Manual Mestre v1.1. Em caso de conflito, prevalece o Manual Mestre.

    ROTAS CANÔNICAS:
    /profissoes/
    /empreendedorismo/
    /<profissao>/
    /<profissao>/a-profissao/
    /<profissao>/formacao/
    /<profissao>/equipamentos/
    /<profissao>/<slug-da-materia>/

    Use exatamente UM dos três modelos de <template> abaixo como conteúdo de <main>.
  -->

  <header class="site-header">
    <div class="wrap topbar">
      <a class="brand" href="/" aria-label="Virada Própria - página inicial">
        <img src="/assets/img/logo-virada-propria.png" alt="Virada Própria" width="245">
      </a>
      <nav class="global-nav" aria-label="Navegação principal">
        <a href="/">Início</a>
        <a href="/empreendedorismo/">Empreendedorismo</a>
        <a href="/profissoes/">Profissões</a>
      </nav>
    </div>
  </header>

  <main id="page-content">
    <!-- SUBSTITUIR ESTE COMENTÁRIO PELO CONTEÚDO DE UM ÚNICO TEMPLATE ABAIXO. -->
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <strong>Virada Própria</strong><br>
        O que você precisa para trabalhar por conta própria.
      </div>
      <div>
        <p class="disclaimer">Disclaimer: as análises são independentes, mas há links afiliados no site que geram comissões qualificadas.</p>
      </div>
    </div>
  </footer>

  <!-- =========================================================
       MODELO 1 — HOME DA PROFISSÃO
       Rota: /<profissao>/
       ========================================================= -->
  <template id="vp-profession-home">
    <div class="wrap breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Início</a><span>›</span><a href="/profissoes/">Profissões</a><span>›</span><span>{{PROFESSION_NAME}}</span>
    </div>

    <section class="hero">
      <div class="wrap">
        <span class="eyebrow">Profissão</span>
        <h1>{{PROFESSION_NAME}}</h1>
        <p class="lead">{{PROFESSION_INTRO}}</p>
      </div>
    </section>

    <section class="content">
      <div class="wrap">
        <nav class="profession-menu" aria-label="Seções de {{PROFESSION_NAME}}">
          <a href="/{{PROFESSION_SLUG}}/a-profissao/">
            <strong>A profissão</strong>
            <span>Informações gerais, início, atuação, clientes, custos e demais matérias da profissão.</span>
          </a>
          <a href="/{{PROFESSION_SLUG}}/formacao/">
            <strong>Formação</strong>
            <span>Cursos, treinamentos, livros e conteúdos de capacitação.</span>
          </a>
          <a href="/{{PROFESSION_SLUG}}/equipamentos/">
            <strong>Equipamentos</strong>
            <span>Reviews e comparativos de equipamentos, ferramentas e produtos.</span>
          </a>
        </nav>
      </div>
    </section>
  </template>

  <!-- =========================================================
       MODELO 2 — PÁGINA DE CATEGORIA
       Rotas:
       /<profissao>/a-profissao/
       /<profissao>/formacao/
       /<profissao>/equipamentos/
       ========================================================= -->
  <template id="vp-category-page">
    <div class="wrap breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Início</a><span>›</span><a href="/profissoes/">Profissões</a><span>›</span>
      <a href="/{{PROFESSION_SLUG}}/">{{PROFESSION_NAME}}</a><span>›</span><span>{{CATEGORY_NAME}}</span>
    </div>

    <section class="hero">
      <div class="wrap">
        <span class="eyebrow">{{PROFESSION_NAME}}</span>
        <h1>{{CATEGORY_NAME}} - {{PROFESSION_NAME}}</h1>
        <p class="lead">{{CATEGORY_INTRO}}</p>
      </div>
    </section>

    <section class="content">
      <div class="wrap content-main">
        <div class="category-list">
          <!-- REPETIR em ordem oficial da pauta para TODAS as matérias da categoria -->
          <article class="article-card">
            <h2>{{ARTICLE_01_TITLE}}</h2>
            <p>{{ARTICLE_01_SUMMARY}}</p>
            <a class="cta" href="/{{PROFESSION_SLUG}}/{{ARTICLE_01_SLUG}}/">Ler matéria →</a>
          </article>
          <!-- /REPETIR -->
        </div>

        <a class="cta-secondary" href="/{{PROFESSION_SLUG}}/">← Voltar para {{PROFESSION_NAME}}</a>
      </div>
    </section>
  </template>

  <!-- =========================================================
       MODELO 3 — MATÉRIA FINAL
       Rota: /<profissao>/<slug-da-materia>/
       ========================================================= -->
  <template id="vp-article-page">
    <div class="wrap breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Início</a><span>›</span><a href="/profissoes/">Profissões</a><span>›</span>
      <a href="/{{PROFESSION_SLUG}}/">{{PROFESSION_NAME}}</a><span>›</span>
      <a href="/{{PROFESSION_SLUG}}/{{CATEGORY_SLUG}}/">{{CATEGORY_NAME}}</a><span>›</span><span>{{ARTICLE_TITLE_SHORT}}</span>
    </div>

    <section class="hero">
      <div class="wrap">
        <span class="eyebrow">{{PROFESSION_NAME}} · {{CATEGORY_NAME}}</span>
        <h1>{{H1}}</h1>
        <p class="lead">{{LEAD}}</p>
      </div>
    </section>

    <article class="content">
      <div class="wrap content-main">
        <!-- CONTEÚDO EDITORIAL DA MATÉRIA -->
        {{ARTICLE_BODY_HTML}}

        <nav class="article-nav" aria-label="Navegação da matéria">
          <!-- REMOVER este bloco inteiro quando esta for a última matéria da categoria. -->
          <a class="next-article" href="/{{PROFESSION_SLUG}}/{{NEXT_ARTICLE_SLUG}}/">
            <small>Próxima matéria</small>
            <strong>{{NEXT_ARTICLE_TITLE}} →</strong>
          </a>

          <div class="return-links">
            <a class="cta-secondary" href="/{{PROFESSION_SLUG}}/{{CATEGORY_SLUG}}/">← Voltar para {{CATEGORY_NAME}}</a>
            <a class="cta-secondary" href="/{{PROFESSION_SLUG}}/">← Voltar para {{PROFESSION_NAME}}</a>
          </div>
        </nav>
      </div>
    </article>
  </template>
</body>
</html>
