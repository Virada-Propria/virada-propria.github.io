<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virada Própria | Trabalhe por conta própria</title>

  <meta name="description" content="Guias práticos para quem quer trabalhar por conta própria: profissões, equipamentos, custos, ferramentas e como começar.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #0F2D4A;
      background: #F7E9D7;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 12px 35px rgba(15,45,74,.12);
      text-align: center;
    }

    .tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #F2F4F7;
      color: #6B8F7B;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1;
      color: #0F2D4A;
    }

    p {
      margin: 0 auto;
      max-width: 600px;
      font-size: 18px;
      line-height: 1.6;
      color: #55636d;
    }

    .status {
      margin-top: 28px;
      padding: 16px;
      border-radius: 14px;
      background: #fff3ec;
      color: #0F2D4A;
      font-weight: 700;
      border-left: 5px solid #FF7A4A;
    }
  </style>
</head>

<body>
  <main>
    <section class="card">
      <span class="tag">Virada Própria</span>

      <h1>Mais que compras.<br>Novos começos.</h1>

      <p>
        Guias práticos para quem quer trabalhar por conta própria,
        escolher uma profissão, organizar o investimento e começar
        com mais clareza.
      </p>

      <div class="status">
        Novo portal em construção.
      </div>
    </section>
  </main>
</body>
</html>
